<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3eb" />
    <title>Wordtrail — seu diário de leitura em inglês</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="app-sidebar">
        <div class="sidebar-header">
          <a class="brand" href="#" data-page="home" aria-label="Wordtrail início">
            <span class="brand-mark">w<span>✳</span></span>
            <span>wordtrail<small>read a little. grow a lot.</small></span>
          </a>
          <div class="sidebar-header-actions">
            <button class="settings-button" id="open-settings" aria-label="Configurações" title="Configurações">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 1.72L9.6 5a8 8 0 0 0-1.16.67l-1.2-.48a2 2 0 0 0-2.5.87l-.22.38a2 2 0 0 0 .5 2.6l1.02.8a8.6 8.6 0 0 0 0 1.34l-1.02.8a2 2 0 0 0-.5 2.6l.22.38a2 2 0 0 0 2.5.87l1.2-.48c.36.27.75.5 1.16.67l.18 1.28a2 2 0 0 0 2 1.72h.44a2 2 0 0 0 2-1.72l.18-1.28c.41-.17.8-.4 1.16-.67l1.2.48a2 2 0 0 0 2.5-.87l.22-.38a2 2 0 0 0-.5-2.6l-1.02-.8a8.6 8.6 0 0 0 0-1.34l1.02-.8a2 2 0 0 0 .5-2.6l-.22-.38a2 2 0 0 0-2.5-.87l-1.2.48A8 8 0 0 0 14.4 5l-.18-1.28a2 2 0 0 0-2-1.72Z"></path><circle cx="12" cy="11" r="3"></circle></svg>
            </button>
            <button class="icon-button sidebar-close" id="mobile-menu-close" aria-label="Fechar menu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
            </button>
          </div>
        </div>
        <div class="sidebar-label">SEU ESPAÇO</div>
        <nav class="main-nav" aria-label="Navegação principal">
          <button class="nav-link active" data-page="home"><span>⌂</span> Visão geral</button>
          <button class="nav-link" data-page="reading"><span>◷</span> Sessão de leitura</button>
          <button class="nav-link" data-page="practice"><span>▤</span> Hora do jogo <i id="due-count" class="nav-count">0</i></button>
          <button class="nav-link" data-page="words"><span>▧</span> Meu vocabulário</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="sidebar-note">
            <span class="note-spark">✳</span>
            <p>Uma página de cada vez.</p>
            <div class="note-progress"><span id="sidebar-progress"></span></div>
            <small id="sidebar-progress-label">0 de 30 min hoje</small>
          </div>
          <div id="account-controls" class="sidebar-account"></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="mobile-header">
          <a class="brand" href="#" data-page="home"><span class="brand-mark">w<span>✳</span></span><span>wordtrail</span></a>
          <button class="icon-button" id="mobile-menu" aria-label="Abrir menu" aria-controls="app-sidebar">☰</button>
        </header>
        <div class="main-scroll">
          <div class="topbar">
            <div><span class="date-label" id="today-label"></span></div>
            <div class="topbar-actions"><button class="topbar-streak" data-page="reading" aria-label="Sequência de leitura"><span aria-hidden="true">🔥</span><strong id="top-streak">0</strong></button></div>
          </div>
          <div id="view" class="view-content"></div>
        </div>
      </main>
    </div>
    <div id="auth-gate" class="auth-gate" hidden>
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="brand-mark" aria-hidden="true">w<span>✳</span></div>
        <span class="eyebrow">SEU DIÁRIO DE LEITURA</span>
        <h1 id="auth-title">Seu progresso, em qualquer lugar</h1>
        <p>Entre com Google para sincronizar palavras, sessões e revisões entre seu computador e celular.</p>
        <button id="google-sign-in" class="button auth-google-button" data-action="sign-in">Continuar com Google</button>
        <button id="retry-cloud-load" class="button outline auth-retry-button" data-action="retry-cloud-load" hidden>Tentar carregar de novo</button>
        <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
      </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
  </body>
</html>
